name: Ingest Batch Regulasi dari GDrive Folder

on:
  workflow_dispatch:
    inputs:
      gdrive_folder_url:
        description: 'URL folder Google Drive berisi PDF regulasi'
        required: true
        type: string

jobs:
  ingest_batch:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Pip Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ingest-batch-v1
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          pip install \
            pdfplumber \
            pymupdf \
            google-api-python-client \
            google-auth \
            requests

      - name: Inject Service Account Key
        run: |
          echo '${{ secrets.GDRIVE_SA_KEY }}' > /tmp/sa_key.json

      - name: Run Batch Ingest
        run: python scripts/ingest_batch.py
        env:
          GDRIVE_FOLDER_URL: ${{ github.event.inputs.gdrive_folder_url }}
          WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          AUTH_TOKEN: ${{ secrets.CF_WORKER_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa_key.json

      - name: Cleanup Credentials
        if: always()
        run: rm -f /tmp/sa_key.json
